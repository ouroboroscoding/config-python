[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "config_oc"
version = "1.1.1"
description = "Handles loading configuration files based on hostname"
authors = [
    {name = "Chris Nasr - Ouroboros Coding Inc.", email = "chris@ouroboroscoding.com"}
]
maintainers = [
    {name = "Chris Nasr - Ouroboros Coding Inc.", email = "chris@ouroboroscoding.com"}
]
license-files = [ "LICENSE" ]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	'jsonb>=1.0.0,<1.1',
	'tools-oc>=1.2.5,<1.3',
	'undefined-oc>=1.0.0,<1.1'
]

[project.urls]
Source = "https://github.com/ouroboroscoding/config"
Tracker = "https://github.com/ouroboroscoding/config/issues"

[tool.hatch.build]
packages = [ "config" ]